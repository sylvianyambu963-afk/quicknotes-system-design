<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>QuickNotes</h1>

        <button id="load-btn">Load notes</button>

        <p id="status"></p>

        <form id="note-form">
            <label for="title-input">Title</label>
            <input type="text" id="title-input" maxlength="100">

            <label for="body-input">Body</label>
            <textarea id="body-input"></textarea>

            <button type="submit" id="submit-btn">Create note</button>
        </form>

        <h2>Notes</h2>

        <ul id="notes-list"></ul>
    </main>
</body>
</html>
